name: CI

# Tests on every push and pull request. No secrets: builds here are unofficial.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Protocol lock matches the vendored spec
        shell: bash
        run: |
          want=$(python -c "import json;print(json.load(open('protocol.lock'))['sha256'])")
          have=$(python -c "import hashlib;print(hashlib.sha256(open('protocol/v1/spec.json','rb').read()).hexdigest())")
          test "$want" = "$have" || { echo "::error::protocol/v1/spec.json differs from protocol.lock"; exit 1; }
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/test_client.py
